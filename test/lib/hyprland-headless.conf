# Minimal Hyprland config for the test harness.
#
# Critically, there are NO exec-once entries: pointing a headless Hyprland at
# the user's real config would autostart a second omarchy-shell, bar and
# friends on top of the running desktop. This config brings up a compositor
# and a virtual output and nothing else, which is all `qs` needs to run.

# Catch-all: nested on a Wayland session the output is named WAYLAND-1, not
# HEADLESS-1, and it defaults to scale 2 -- which made screenshots twice the
# logical size and every crop region wrong. Pin size and scale explicitly.
monitor = , 1920x1080@60, 0x0, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations { enabled = false }
decoration { blur { enabled = false } }

# Escape hatch if a test ever wedges an interactive compositor.
bind = SUPER SHIFT, Q, exit
